name: UESP PRCE Global Audit
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install
        run: pip install boto3 groq requests apify-client

      - name: Run Audit Engine
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IP_TOKEN: ${{ secrets.IP_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MASSIVE_ACCESS_KEY: ${{ secrets.MASSIVE_ACCESS_KEY_ID }}
          MASSIVE_SECRET_KEY: ${{ secrets.MASSIVE_SECRET_KEY }}
        run: python main.py

      - name: Deploy Result
        run: |
          git config --global user.name "UESP-Bot"
          git config --global user.email "bot@uesp.io"
          git add shi_data.json
          git commit -m "UESP Audit Update" || exit 0
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
