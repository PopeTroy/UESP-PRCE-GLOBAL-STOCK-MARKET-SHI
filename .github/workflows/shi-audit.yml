name: UESP PRCE Global Audit
on:
  schedule:
    - cron: '*/5 * * * *' # Automated audit every 5 minutes
  workflow_dispatch:      # Allows manual trigger for testing

jobs:
  audit:
    runs-on: ubuntu-latest
    
    # FIX FOR CODE 128: Granting the Action write access to the repo
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Updated to latest version
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 groq requests

      - name: Run Mega Circuit Logic
        env:
          MASSIVE_ACCESS_KEY: ${{ secrets.MASSIVE_ACCESS_KEY_ID }}
          MASSIVE_SECRET_KEY: ${{ secrets.MASSIVE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Commit and Push SHI Data
        run: |
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"
          
          # Check if the file exists before attempting to commit
          if [ -f "shi_data.json" ]; then
            git add shi_data.json
            git commit -m "UESP PRCE: Global Audit Updated [$(date)]" || echo "No changes to commit"
            git push
          else
            echo "Error: shi_data.json was not generated by the script."
            exit 1
          fi
