name: UESP PRCE Global Audit
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Internal permission for the runner
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Uses the built-in security token

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install boto3 groq requests

      - name: Run Mega Circuit Logic
        env:
          MASSIVE_ACCESS_KEY: ${{ secrets.MASSIVE_ACCESS_KEY_ID }}
          MASSIVE_SECRET_KEY: ${{ secrets.MASSIVE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Commit and Push SHI Data
        run: |
          # 1. Set Identity
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 2. Add the file
          git add shi_data.json
          
          # 3. Use the GITHUB_TOKEN directly in the push URL to force access
          git commit -m "UESP PRCE: Audit Sync $(date)" || echo "No changes to commit"
          git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
