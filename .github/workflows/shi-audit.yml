name: UESP PRCE Global Audit
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false # We will provide credentials manually below

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install boto3 groq requests

      - name: Run Mega Circuit Logic
        env:
          MASSIVE_ACCESS_KEY: ${{ secrets.MASSIVE_ACCESS_KEY_ID }}
          MASSIVE_SECRET_KEY: ${{ secrets.MASSIVE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Commit and Push SHI Data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add shi_data.json
          
          # Only commit if there are changes
          if ! git diff --cached --exit-code; then
            git commit -m "UESP PRCE: Audit Update $(date)"
            # Force push using the GITHUB_TOKEN directly in the URL
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main --force
          else
            echo "No changes detected in SHI data."
          fi
