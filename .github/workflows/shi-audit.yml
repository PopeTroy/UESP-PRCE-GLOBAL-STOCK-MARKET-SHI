name: UESP PRCE Global Audit
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Explicitly requesting the write key
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Hard-codes the key into the checkout

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install boto3 groq requests

      - name: Run Mega Circuit Logic
        env:
          MASSIVE_ACCESS_KEY: ${{ secrets.MASSIVE_ACCESS_KEY_ID }}
          MASSIVE_SECRET_KEY: ${{ secrets.MASSIVE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Commit and Push SHI Data
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          git add shi_data.json
          
          # This line forces the push using the token as a password
          git commit -m "UESP PRCE: Sync $(date)" || exit 0
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
