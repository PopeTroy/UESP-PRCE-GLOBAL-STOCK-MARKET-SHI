name: UESP PRCE Global Audit
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Internal permission for the runner
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Uses the built-in security token

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install boto3 groq requests

      - name: Run Mega Circuit Logic
        env:
          MASSIVE_ACCESS_KEY: ${{ secrets.MASSIVE_ACCESS_KEY_ID }}
          MASSIVE_SECRET_KEY: ${{ secrets.MASSIVE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Commit and Push SHI Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add shi_data.json
          # Only commit if changes exist; prevents crash if data is identical
          git diff --quiet && git diff --staged --quiet || (git commit -m "UESP PRCE: Audit Sync $(date)" && git push)
